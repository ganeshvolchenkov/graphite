# Render blueprint for the StressTest backend.
#
# Deploy: render.com -> New -> Blueprint -> pick this repo -> it reads this file.
# The only thing to fill in by hand is NEBIUS_API_KEY (sync: false keeps it out
# of the repo, so Render prompts for it).
#
# `plan: free` sleeps after ~15 minutes idle and takes ~40s to wake. Switch to
# `starter` before judging if a cold start during the demo is unacceptable.

services:
  - type: web
    name: stresstest-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEBIUS_API_KEY
        sync: false
