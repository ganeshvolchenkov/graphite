# Fly.io config for the StressTest API.
#
#   fly auth login
#   fly launch --copy-config --no-deploy      # claims the app name
#   fly secrets set NEBIUS_API_KEY=... STRESSTEST_API_KEY=...
#   fly deploy --remote-only                 # builds on Fly, no local Docker
#
# Deploys from this directory, so it needs no GitHub access.

app = 'stresstest-api'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero. A cold start in front of a judge is not recoverable,
  # and the whole point of this host is that the link keeps working.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '20s'
  method = 'GET'
  path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
